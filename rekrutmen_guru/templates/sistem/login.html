{% load static %}
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — SPK Rekrutmen Guru</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .login-wrapper {
        display: flex;
        min-height: 100vh;
      }

      /* Kiri — teal */
      .login-left {
        width: 60%;
        background: #2d7d8e;
        display: flex;
        flex-direction: column;
        padding: 32px 40px;
        position: relative;
        overflow: hidden;
      }
      .login-left-logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .login-left-logo-icon {
        width: 44px;
        height: 44px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      .login-left-logo-text {
        color: #fff;
        font-size: 16px;
        font-weight: 600;
      }
      .login-left-logo-sub {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
      }

      /* Lingkaran dekoratif */
      .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }
      .circle-1 {
        width: 400px;
        height: 400px;
        top: -80px;
        right: -100px;
      }
      .circle-2 {
        width: 300px;
        height: 300px;
        bottom: -60px;
        left: -80px;
      }
      .circle-3 {
        width: 180px;
        height: 180px;
        bottom: 120px;
        right: 60px;
      }

      /* Kanan — form */
      .login-right {
        width: 40%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
      }
      .login-form-wrap {
        width: 100%;
        max-width: 360px;
      }
      .login-title {
        font-size: 22px;
        font-weight: 700;
        color: #2d7d8e;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      .login-sub {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        margin-bottom: 36px;
      }
      .login-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .login-input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        border: 1.5px solid #2d7d8e;
        border-radius: 8px;
        font-size: 13px;
        color: var(--text-primary);
        outline: none;
        transition: border 0.15s;
        margin-bottom: 20px;
      }
      .login-input:focus {
        border-color: #1f6070;
      }
      .login-forgot {
        display: block;
        text-align: right;
        font-size: 12px;
        color: #2d7d8e;
        margin-top: -14px;
        margin-bottom: 28px;
        cursor: pointer;
      }
      .login-forgot:hover {
        text-decoration: underline;
      }
      .login-btn {
        width: 100%;
        height: 46px;
        background: #2d7d8e;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: background 0.15s;
      }
      .login-btn:hover {
        background: #1f6070;
      }
      .login-error {
        background: #fde8e8;
        color: #b42318;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <!-- Kiri -->
      <div class="login-left">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        {% load static %}
        <div class="login-left-logo">
          <img src="{% static 'img/logo.png' %}"
               alt="Logo Yayasan Al Hasanah"
               style="width:44px;
                      height:44px;
                      border-radius:10px;
                      object-fit:cover;
                      flex-shrink:0">
          <div>
            <div class="login-left-logo-text">Yayasan Al Hasanah</div>
            <div class="login-left-logo-sub">Sistem Pendukung Keputusan Rekrutmen Guru</div>
          </div>
        </div>
      </div>
      <!-- Kanan -->
      <div class="login-right">
        <div class="login-form-wrap">
          <div class="login-title">SELAMAT DATANG</div>
          <div class="login-sub">MASUK SEBAGAI ADMINISTRATOR REKRUTMEN GURU</div>
          {% if error %}
            <div class="login-error">
              <i class="ti ti-alert-circle"></i> {{ error }}
            </div>
          {% endif %}
          <form method="POST">
            {% csrf_token %}
            <label class="login-label">Email</label>
            <input type="text"
                   name="username"
                   class="login-input"
                   placeholder=""
                   autocomplete="username" />
            <label class="login-label">Password</label>
            <input type="password"
                   name="password"
                   class="login-input"
                   placeholder=""
                   autocomplete="current-password" />
            <a class="login-forgot" href="#">Lupa Password?</a>
            <button type="submit" class="login-btn">MASUK</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
